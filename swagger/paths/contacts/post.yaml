#/swagger/paths/contacts/post.yaml
tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380501234567'
          email:
            description: "Contact's email"
            type: string
            example: 'lTg4o@example.com'
          isFavourite:
            description: "Contact's favourite status"
            type: boolean
            example: true
          contactType:
            description: "Contact's type"
            type: string
            example: 'work'
            enum:
              - work
              - home
              - personal
          userId:
            description: "User's id"
            type: string
            example: 673f8afd7f03a56110c1bea2
          photo:
            description: "Contact's photo"
            type: string
            example: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
