# swagger/paths/contacts/{id}/delete.yaml
tags:
  - Contacts
summary: Delete contact by id
operationId: deleteContact
description: 'Delete contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '671773d5fb1ae9660ff54c39'
responses:
  '204':
    description: 'Delete contact by id'
  '404':
    description: 'Contact not found'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact with id 671773d5fb1ae9660ff54c39 not found!'
