# swagger/paths/contacts/{id}/patch.yaml
tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Patch contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '671773d5fb1ae9660ff54c39'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '1234567890'
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
            example: 'work'
          email:
            description: "Contact's email"
            type: string
            example: 'lTg4o@example.com'
          isFavourite:
            description: "Contact's favourite status"
            type: boolean
            example: true
          photo:
            description: "Contact's photo"
            type: string
            format: binary
            example: 'https://example.com/photo.jpg'
responses:
  200:
    description: Successfully patched contact!
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 200
            message:
              type: string
              example: Successfully patched contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '404':
    description: 'Contact not found'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact with id 671773d5fb1ae9660ff54c39 not found!'
